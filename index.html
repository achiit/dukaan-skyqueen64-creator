<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKYQUEEN – Create. Connect. Grow.</title>
<meta name="description" content="SKYQUEEN by Prabhjot Kaur Mehra: professional website development and premium digital eBooks.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#07050d;--card:#130d22;--pur:#6d28d9;--pur2:#a855f7;--gold:#d4af37;--gold2:#f5d77a;--txt:#f4f0fa;--mut:#a79fba;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:radial-gradient(circle at 20% -10%,#2a1058 0,transparent 45%),var(--bg);color:var(--txt);font:400 16px/1.7 Poppins,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;background:#07050dd9;backdrop-filter:blur(12px);border-bottom:1px solid #d4af3733}
.logo{font:700 24px 'Playfair Display',serif;letter-spacing:3px;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--pur2));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.logo svg{width:30px;height:30px}
.links{display:flex;gap:20px;font-size:14px}.links a{color:var(--mut);transition:.3s}.links a:hover,.links a.on{color:var(--gold2)}
#burger{display:none;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:4px 10px;font-size:20px}
@media(max-width:860px){#burger{display:block}.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#0d0818;padding:18px 5%;gap:14px}.links.open{display:flex}}
.btn{display:inline-block;padding:13px 28px;border-radius:40px;font-weight:600;font-size:15px;border:0;cursor:pointer;transition:.3s;font-family:inherit}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1204;box-shadow:0 0 24px #d4af3755}
.ghost{border:1px solid var(--pur2);color:var(--txt);background:#6d28d933}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px #a855f766}
.wa{background:#25d366;color:#04230f}
section,.page{padding:70px 5%;max-width:1150px;margin:auto}
.page{animation:fade .6s}@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.hero{text-align:center;padding:110px 5% 90px;max-width:900px;margin:auto}
.hero h1{font-size:clamp(30px,6vw,56px)}.hero h1 span{background:linear-gradient(90deg,var(--gold2),var(--pur2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:22px auto 34px;max-width:640px}.hero .btn{margin:6px}
.tag{letter-spacing:4px;color:var(--gold);font-size:13px;margin-bottom:14px}
h2{font-size:clamp(26px,4vw,38px);margin-bottom:10px}h2+.sub{color:var(--mut);margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:linear-gradient(160deg,var(--card),#0c0817);border:1px solid #a855f733;border-radius:18px;padding:26px;transition:.35s}
.card:hover{border-color:var(--gold);box-shadow:0 0 28px #a855f744;transform:translateY(-5px)}
.card .ic{font-size:30px;margin-bottom:10px}.card h3{font-size:19px;margin-bottom:6px;color:var(--gold2)}.card p{color:var(--mut);font-size:14px}
.cover{aspect-ratio:3/4;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid #d4af3755}
.cover b{font:700 21px 'Playfair Display',serif;color:#fff;position:relative;text-shadow:0 2px 8px #000}.cover small{color:var(--gold2);letter-spacing:3px;position:relative;font-size:11px}
.price{color:var(--gold2);font-weight:600;font-size:20px}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.pill{border:1px solid #a855f766;background:none;color:var(--txt);padding:7px 16px;border-radius:30px;cursor:pointer;font:inherit;font-size:13px}.pill.on{background:var(--pur);border-color:var(--gold)}
form{display:grid;gap:14px}input,select,textarea{width:100%;padding:13px 16px;border-radius:12px;border:1px solid #a855f755;background:#0d0818;color:var(--txt);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:30px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.pf{height:170px;border-radius:12px;margin-bottom:12px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#3b0f8c,#0d0818)}
footer{border-top:1px solid #d4af3733;padding:40px 5% 30px;text-align:center;color:var(--mut);font-size:14px;margin-top:40px}
footer .fl{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:16px 0}
.soc{display:flex;gap:12px;justify-content:center;margin:14px 0}.soc a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);transition:.3s}.soc a:hover{background:var(--pur);transform:scale(1.12)}.soc svg{width:20px;height:20px;fill:var(--gold2)}
.float{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 0 24px #25d36688}.float svg{width:30px;fill:#fff}
.legal p,.legal li{color:var(--mut);margin-bottom:12px}.legal h3{margin:22px 0 8px;color:var(--gold2)}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #a855f733;text-align:left;font-size:14px}
.sm{padding:6px 12px;font-size:13px}
</style></head><body>
<nav><a href="#home" class="logo"><svg viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f5d77a"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path d="M4 28l5-14 7 8 4-14 4 14 7-8 5 14z" fill="url(#g)"/><rect x="4" y="30" width="32" height="4" rx="2" fill="url(#g)"/></svg>SKYQUEEN</a>
<button id="burger" aria-label="Menu">☰</button>
<div class="links" id="links"><a href="#home">Home</a><a href="#about">About</a><a href="#services">Services</a><a href="#portfolio">Portfolio</a><a href="#store">eBook Store</a><a href="#contact">Contact</a></div></nav>
<main id="app"></main>
<a class="float" id="wafl" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.3-.5.1-1.2.1-3.700-1-3.100-1.400-5.100-4.600-5.300-4.800-.1-.2-1.300-1.700-1.300-3.200s.8-2.300 1.100-2.600c.3-.3.600-.4.800-.4h.6c.2 0 .5-.1.700.5l1 2.300c.1.200.1.400 0 .6l-.4.600-.5.500c-.2.200-.3.400-.1.700.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.700-.1l2.100 1c.3.100.5.200.5.400.1.100.1.700-.100 1.400z"/></svg></a>
<footer><div class="logo" style="justify-content:center">SKYQUEEN</div><p><b style="color:var(--gold2)">CREATE. CONNECT. GROW.</b></p>
<div class="soc" id="soc"></div>
<div class="fl"><a href="#privacy">Privacy Policy</a><a href="#terms">Terms and Conditions</a><a href="#refund">Refund and Digital Product Policy</a><a href="#admin">Admin</a></div>
<p>© 2026 SKYQUEEN – Prabhjot Kaur Mehra · +91 8872702748</p></footer>
<script>
const PH='918872702748',WA='https://wa.me/'+PH,IG='https://www.instagram.com/skyqueen_9780?xtok=bjNuZzZlaHE4azM4',FB='https://www.facebook.com/share/1DfKFQSzD9/';
const wl=t=>WA+'?text='+encodeURIComponent(t);
document.getElementById('wafl').href=wl('Hello SKYQUEEN, I have an enquiry.');
const ico={ig:'<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm0 2a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3zm5 3.500A4.500 4.500 0 1112 16.500 4.500 4.500 0 0112 7.500zm0 2A2.500 2.500 0 1012 14.500 2.500 2.500 0 0012 9.500zM17.500 6a1 1 0 110 2 1 1 0 010-2z"/></svg>',fb:'<svg viewBox="0 0 24 24"><path d="M14 8V6c0-1 .3-1.500 1.600-1.500H18V1h-3.200C11.300 1 10 3 10 5.600V8H7v3.500h3V23h4V11.500h3.300L18 8z"/></svg>',wa:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.600 15L2 22l5.200-1.400A10 10 0 1012 2zm0 2a8 8 0 11-4.200 14.800l-.3-.2-2.600.7.7-2.500-.2-.3A8 8 0 0112 4zm-3 4c-.3 0-.6.300-.8.700-.4 1.200.2 2.600 1.500 4 1.400 1.600 3.300 2.500 4.600 2.300.6-.1 1.200-.7 1.300-1.200 0-.2 0-.4-.2-.5l-1.500-.7c-.2-.1-.4 0-.5.100l-.6.700c-1-.4-2-1.300-2.400-2.300l.6-.6c.1-.1.100-.3 0-.5L9.600 8.200C9.500 8 9.300 8 9 8z"/></svg>'};
document.getElementById('soc').innerHTML=[[IG,'ig','Instagram'],[FB,'fb','Facebook'],[wl('Hello SKYQUEEN!'),'wa','WhatsApp']].map(([h,i,n])=>`<a href="${h}" target="_blank" rel="noopener" aria-label="${n}">${ico[i]}</a>`).join('');
const cats=['Business and Entrepreneurship','Digital Marketing','Self-Growth and Motivation','Online Business','Skills and Learning','Personal Development'];
const hues=[['#4c1d95','#0b0614'],['#7e22ce','#1a0b2e'],['#1e1b4b','#6d28d9'],['#581c87','#000'],['#312e81','#a855f7'],['#3b0764','#d4af37']];
const seed=[
['Launch Your Online Business','Business and Entrepreneurship',499,'A step-by-step blueprint to start, brand and launch a profitable online venture from home.'],
['Digital Marketing Mastery','Digital Marketing',599,'Social media, SEO and content strategies to attract customers and grow your audience.'],
['The Unstoppable Mindset','Self-Growth and Motivation',299,'Daily habits and mindset shifts to build confidence, discipline and motivation.'],
['Earn Online: Freelancing Guide','Online Business',399,'Find clients, price your services and build a steady freelance income.'],
['Learn Skills Faster','Skills and Learning',249,'Proven techniques to learn any digital skill quickly and retain it.'],
['Become Your Best Self','Personal Development',349,'A practical journey of goal setting, productivity and personal growth.']];
let P;try{P=JSON.parse(localStorage.getItem('sq_p'))}catch(e){}
if(!P||!P.length)P=seed.map((s,i)=>({id:'ebook-'+(i+1),t:s[0],c:s[1],p:s[2],d:s[3]}));
const save=()=>{try{localStorage.setItem('sq_p',JSON.stringify(P))}catch(e){}};
const cover=(b,i)=>{const h=hues[i%6];return `<div class="cover" style="background:linear-gradient(160deg,${h[0]},${h[1]})"><small>SKYQUEEN eBOOK</small><b>${b.t}</b></div>`};
const card=(b,i)=>`<div class="card"><a href="#${b.id}">${cover(b,i)}<h3>${b.t}</h3></a><p>${b.c}</p><p class="price">₹${b.p}</p><br><a class="btn gold sm" href="#${b.id}">View Details</a></div>`;
const svc=[['🏢','Business Website Development','Powerful sites that build credibility and bring in customers.'],['👤','Personal Portfolio Websites','Showcase your talent with an elegant personal brand site.'],['🛒','E-commerce Websites','Online stores built to sell, with smooth checkout.'],['🚀','Landing Page Design','High-converting pages for campaigns and launches.'],['👑','Professional Brand Websites','Premium identity-driven websites that stand out.'],['🏪','Small Business Websites','Affordable, fast sites for local and growing businesses.'],['🎨','Website Redesign and Customization','Give your existing site a fresh, modern upgrade.']];
const why=[['💼','Professional Website Solutions'],['🎨','Creative Digital Designs'],['📚','Valuable Digital Resources'],['🤝','Customer-Focused Service'],['💎','Affordable Packages'],['🛟','Dedicated Support']];
const legal=(t,s)=>`<div class="page legal"><h2>${t}</h2>${s}<p><i>Last updated: November 2026. Please have this reviewed by a legal professional before launch.</i></p></div>`;
const R={
home:()=>`<div class="hero"><div class="tag">CREATE. CONNECT. GROW.</div><h1>WELCOME TO <span>SKYQUEEN</span> – TURN YOUR DIGITAL DREAMS INTO REALITY.</h1><p>Your Digital Growth Partner. We create professional websites and provide valuable digital eBooks to help individuals and businesses grow online.</p><a class="btn gold" href="#services">Explore Our Services</a><a class="btn ghost" href="#store">Shop eBooks</a></div>
<section><h2>Why Choose SKYQUEEN?</h2><p class="sub">Premium quality, personal attention.</p><div class="grid">${why.map(w=>`<div class="card"><div class="ic">${w[0]}</div><h3>${w[1]}</h3></div>`).join('')}</div></section>
<section><h2>Featured eBooks</h2><p class="sub">Knowledge that helps you grow.</p><div class="grid">${P.slice(0,3).map(card).join('')}</div></section>
<section style="text-align:center"><h2>Ready to build your website?</h2><p class="sub">Let’s turn your idea into a brand people trust.</p><a class="btn wa" target="_blank" href="${wl('Hello SKYQUEEN, I want to get a website.')}">Get Your Website on WhatsApp</a></section>`,
about:()=>`<div class="page"><div class="tag">ABOUT US</div><h2>Meet the Founder</h2><div class="card"><p style="color:var(--txt)">Hello! I’m Prabhjot Kaur Mehra, the founder of SKYQUEEN. I am passionate about digital creativity, website development, and helping people explore opportunities in the digital world.</p><br><p style="color:var(--txt)">Through SKYQUEEN, my mission is to provide professional website creation services and valuable eBooks that help individuals, entrepreneurs, and businesses establish and grow their online presence.</p><br><p style="color:var(--txt)">My vision is to build a trusted digital brand that inspires creativity, learning, and success.</p></div></div>
<section><h2>Why Choose SKYQUEEN?</h2><br><div class="grid">${why.map(w=>`<div class="card"><div class="ic">${w[0]}</div><h3>${w[1]}</h3></div>`).join('')}</div></section>`,
services:()=>`<div class="page"><div class="tag">OUR SERVICES</div><h2>Website Development</h2><p class="sub">Elegant, fast and conversion-focused websites.</p><div class="grid">${svc.map(s=>`<div class="card"><div class="ic">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div><br><br><div style="text-align:center"><a class="btn wa" target="_blank" href="${wl('Hello SKYQUEEN, I want to get a website.')}">Get Your Website</a></div></div>`,
portfolio:()=>`<div class="page"><div class="tag">PORTFOLIO</div><h2>Website Portfolio</h2><p class="sub">A showcase of completed projects. Add your real projects here.</p><div class="grid">${['Business Website','Portfolio Website','E-commerce Store'].map((n,i)=>`<div class="card"><div class="pf">${['🏢','👤','🛒'][i]}</div><h3>${n} (Sample)</h3><p>Project placeholder – replace with your client work, screenshot and link.</p></div>`).join('')}</div></div>`,
store:()=>`<div class="page"><div class="tag">eBOOK STORE</div><h2>Digital eBook Store</h2><p class="sub">Instant digital delivery after purchase.</p><div class="pills" id="pills"></div><div class="grid" id="bk"></div></div>`,
contact:()=>`<div class="page"><div class="tag">CONTACT US</div><h2>Let’s Connect</h2><br><div class="two"><div class="card"><h3>SKYQUEEN – Prabhjot Kaur Mehra</h3><br><p>📞 <a href="tel:+918872702748">+91 8872702748</a></p><p>📷 <a href="${IG}" target="_blank">Instagram</a></p><p>📘 <a href="${FB}" target="_blank">Facebook</a></p><br><a class="btn wa" target="_blank" href="${wl('Hello SKYQUEEN, I have an enquiry.')}">Chat on WhatsApp</a></div>
<form id="cf"><input name="n" placeholder="Full Name" required><input name="e" type="email" placeholder="Email Address" required><input name="p" type="tel" placeholder="Phone Number" required><select name="s">${svc.map(s=>`<option>${s[1]}</option>`).join('')}<option>eBook Enquiry</option></select><textarea name="m" rows="4" placeholder="Message" required></textarea><button class="btn gold">Send Enquiry</button><small id="ok" style="color:var(--gold2)"></small></form></div></div>`,
privacy:()=>legal('Privacy Policy','<p>SKYQUEEN respects your privacy. We collect only the details you provide (name, email, phone, message) to respond to enquiries and deliver purchases.</p><h3>Use of Information</h3><p>Your information is used for communication, order delivery and service improvement. We never sell your personal data.</p><h3>Payments</h3><p>Payments are handled by secure third-party gateways; we do not store card details.</p><h3>Contact</h3><p>Questions? Call +91 8872702748.</p>'),
terms:()=>legal('Terms and Conditions','<p>By using this website you agree to these terms.</p><h3>Services</h3><p>Website projects are delivered per the scope and timeline agreed on WhatsApp or in writing.</p><h3>Intellectual Property</h3><p>eBooks are for personal use only. Copying, reselling or sharing them is prohibited.</p><h3>Liability</h3><p>SKYQUEEN is not liable for indirect losses arising from use of its content or services.</p>'),
refund:()=>legal('Refund and Digital Product Policy','<p>Because eBooks are delivered digitally and cannot be returned, all sales are generally final.</p><h3>Exceptions</h3><p>If you receive a corrupted file, wrong product or are charged twice, contact us within 7 days for a replacement or refund.</p><h3>Website Services</h3><p>Advance payments for custom website work are refundable only before work begins, as agreed.</p><h3>Delivery</h3><p>eBooks are delivered digitally after successful payment.</p>'),
admin:()=>`<div class="page"><div class="tag">ADMIN</div><h2>Product Dashboard</h2><p class="sub">Add eBooks and update prices. Changes are saved in this browser only until a backend is connected.</p>
<form id="af" class="card"><input name="t" placeholder="eBook title" required><select name="c">${cats.map(c=>`<option>${c}</option>`).join('')}</select><input name="p" type="number" min="0" placeholder="Price ₹" required><textarea name="d" rows="3" placeholder="Description" required></textarea><button class="btn gold">Add eBook</button></form><br>
<div style="overflow-x:auto"><table><tr><th>Title</th><th>Price ₹</th><th></th></tr>${P.map(b=>`<tr><td>${b.t}</td><td><input type="number" value="${b.p}" style="width:90px" onchange="upd('${b.id}',this.value)"></td><td><button class="btn ghost sm" onclick="del('${b.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`
};
window.upd=(id,v)=>{P.find(b=>b.id==id).p=+v;save()};window.del=id=>{P=P.filter(b=>b.id!=id);save();route()};
function product(id){const i=P.findIndex(b=>b.id==id),b=P[i];if(!b)return R.store();
return `<div class="page"><a href="#store" style="color:var(--gold)">← Back to store</a><br><br><div class="two"><div style="max-width:340px">${cover(b,i)}</div><div><div class="tag">${b.c.toUpperCase()}</div><h2>${b.t}</h2><p style="color:var(--mut)">${b.d}</p><br><p class="price" style="font-size:30px">₹${b.p}</p><p style="color:var(--mut);font-size:14px">Digital PDF · Instant delivery after payment</p><br><a class="btn gold" target="_blank" href="${wl('Hello SKYQUEEN, I want to buy the eBook: '+b.t+' (₹'+b.p+')')}">Buy Now</a></div></div></div>`}
function route(){let h=location.hash.slice(1)||'home';const app=document.getElementById('app');
app.innerHTML=R[h]?R[h]():h.startsWith('ebook-')?product(h):R.home();
document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+h));
document.getElementById('links').classList.remove('open');window.scrollTo(0,0);
if(h=='store'){let cur='All';const draw=()=>{pills.innerHTML=['All',...cats].map(c=>`<button class="pill ${c==cur?'on':''}" data-c="${c}">${c}</button>`).join('');bk.innerHTML=P.map((b,i)=>cur=='All'||b.c==cur?card(b,i):'').join('')||'<p>No eBooks yet.</p>';pills.querySelectorAll('button').forEach(x=>x.onclick=()=>{cur=x.dataset.c;draw()})};draw()}
const cf=document.getElementById('cf');if(cf)cf.onsubmit=e=>{e.preventDefault();const f=new FormData(cf);window.open(wl(`New enquiry from SKYQUEEN website\nName: ${f.get('n')}\nEmail: ${f.get('e')}\nPhone: ${f.get('p')}\nService: ${f.get('s')}\nMessage: ${f.get('m')}`),'_blank');ok.textContent='Thank you! Your enquiry opened in WhatsApp – tap send to complete.'};
const af=document.getElementById('af');if(af)af.onsubmit=e=>{e.preventDefault();const f=new FormData(af);P.push({id:'ebook-'+Date.now(),t:f.get('t'),c:f.get('c'),p:+f.get('p'),d:f.get('d')});save();route()}}
burger.onclick=()=>links.classList.toggle('open');addEventListener('hashchange',route);route();
</script></body></html>
